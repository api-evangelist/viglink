aid: viglink
name: VigLink (Sovrn Commerce)
description: VigLink pioneered automatic affiliate link monetization for publishers,
  turning ordinary product links into revenue-generating affiliate links across a
  network of tens of thousands of merchants. Founded in 2009 and backed by investors
  including Uncork Capital, VigLink was acquired by Sovrn in early 2018 and now operates
  as Sovrn Commerce. The product's public APIs still run on VigLink infrastructure
  (api.viglink.com, rest.viglink.com, viglink.io) and cover link monetization checks,
  real-time bid checks, campaigns, real-time revenue reporting, merchant summaries,
  product recommendations, promo codes, and price comparisons, documented on the
  Sovrn Developer Center alongside a hosted Commerce MCP server for AI agents.
