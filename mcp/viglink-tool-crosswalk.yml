  campaigns, get_product_recommendations). For the other 12 the crosswalk binds by
  METHOD + path, because the provider's published spec gives no stable operation
  identifier to bind to. That absence is itself the finding — it is what stops an
  agent from resolving an MCP tool back to a named contract operation.
