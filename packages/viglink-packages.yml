packages:
- language: javascript
  name: vglnk
  title: Commerce JavaScript library
  official: true
  registry: cdn
  url: https://cdn.viglink.com/api/vglnk.js
  install: >-
    HTML script-tag snippet copied from https://commerce.sovrn.com/install (embeds
    your Commerce API key)
  version: null
  published: null
  version_note: >-
    Unpinned CDN distribution. The install snippet loads
    https://cdn.viglink.com/api/vglnk.js with no version segment and the file carries
    no registry metadata endpoint, so a consumer cannot tell which build they are
    executing — it floats to whatever Sovrn last deployed. Probed 2026-08-13:
    HTTP 200, 29,330 bytes.
  docs:
  - https://developer.sovrn.com/docs/configuration-with-javascript
  - https://developer.sovrn.com/docs/javascript-api
  api:
  - vglnk.open( url[, target] )
  - vglnk.link( link )
  note: >-
    Auto-monetizes outbound links on a publisher page and exposes a small JS API for
    programmatic link monetization. Calls the Link Check API at api.viglink.com/api;
    the api_url option exists so publishers can front it with their own CNAME.
    Cross-linked from components/viglink-components.yml.
