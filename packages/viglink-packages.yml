description: >-
  First-party client libraries published by VigLink (Sovrn Commerce). Sovrn ships no
  packages to any public language registry — npm, PyPI, RubyGems, Packagist, Maven
  Central, NuGet, crates.io and pkg.go.dev were all probed for viglink/sovrn package
  names and every one returned 404. The only first-party client distribution is the
  Commerce JavaScript library (vglnk), served unversioned from the Sovrn CDN and
  installed as a script tag from the publisher's Commerce install page.
