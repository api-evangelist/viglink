description: Sovrn Commerce (formerly VigLink) publishes no separate sandbox
  environment, test keys, or magic test values. Testing is done through the
  interactive "Try It" API console on each Sovrn Developer Center reference page,
  authenticated with your real site Secret Key (the legacy VigLink Help Center
  article "How to test Sovrn //Commerce APIs" documented the same console-based
  approach). No test-vs-live key separation is documented.
console:
  type: api-explorer
  url: https://developer.sovrn.com/reference/link
