description: >-
  Binds each published Commerce MCP tool to the Sovrn Commerce REST operation that
  backs it, so an agent can see which MCP tool inherits which OpenAPI parameters and
  which capabilities exist on only one surface. The live MCP schema is auth-gated —
  POST tools/list to https://mcp.sovrn.com/commerce returned HTTP 401
  {"error":"invalid_token"} on 2026-08-13 — so tools are mapped by name and published
  description, not by fetched inputSchema. Confidence is recorded per row accordingly.
